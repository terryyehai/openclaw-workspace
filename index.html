<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦐 小蝦理財機器人</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #fff; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; padding: 30px 0; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 30px; }
        header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 25px; }
        .stat-card .label { color: #888; font-size: 0.9em; margin-bottom: 5px; }
        .stat-card .value { font-size: 1.8em; font-weight: bold; }
        .positive { color: #4ade80; }
        .negative { color: #f87171; }
        .section { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 25px; margin-bottom: 20px; }
        .section h2 { font-size: 1.3em; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { color: #888; font-weight: normal; font-size: 0.9em; }
        .loading { text-align: center; padding: 40px; color: #888; }
        .note { background: rgba(255,200,0,0.1); border: 1px solid rgba(255,200,0,0.3); border-radius: 10px; padding: 15px; margin-bottom: 20px; text-align: center; color: #ffd700; }
    </style>
    <meta http-equiv="refresh" content="300">
</head>
<body>
    <div class="container">
        <header>
            <h1>🦐 小蝦理財機器人</h1>
            <div class="subtitle">虛擬股票投資系統 | 目標：跑贏大盤</div>
        </header>
        <div class="note">⚠️ 靜態展示版。最新數據請查看本地儀表板 http://127.0.0.1:5000</div>
        <div class="stats-grid">
            <div class="stat-card"><div class="label">總市值</div><div class="value" id="total">載入中...</div></div>
            <div class="stat-card"><div class="label">現金</div><div class="value" id="cash">載入中...</div></div>
            <div class="stat-card"><div class="label">投資損益</div><div class="value" id="profit">載入中...</div></div>
            <div class="stat-card"><div class="label">vs 大盤</div><div class="value" id="vs">載入中...</div></div>
        </div>
        <div class="section"><h2>📈 持股</h2><div id="holdings"><div class="loading">載入中...</div></div></div>
        <div class="section"><h2>📜 交易記錄</h2><div id="trades"><div class="loading">載入中...</div></div></div>
        <div style="text-align:center;padding:20px;color:#666;">更新: <span id="updated">-</span></div>
    </div>
    <script>
    async function load() {
        try {
            const r = await fetch('http://127.0.0.1:5000/api');
            const d = await r.json();
            document.getElementById('total').textContent = '$' + d.total_value.toLocaleString();
            document.getElementById('cash').textContent = '$' + d.cash.toLocaleString();
            const p = document.getElementById('profit');
            p.textContent = (d.profit>=0?'+':'') + '$' + d.profit.toLocaleString() + ' (' + d.profit_pct.toFixed(1) + '%)';
            p.className = 'value ' + (d.profit>=0?'positive':'negative');
            const v = document.getElementById('vs');
            v.textContent = (d.vs_benchmark>=0?'+':'') + d.vs_benchmark.toFixed(1) + '%';
            v.className = 'value ' + (d.vs_benchmark>=0?'positive':'negative');
            document.getElementById('updated').textContent = d.updated;
        } catch(e) {
            document.getElementById('total').textContent = '請訪問本地';
        }
    }
    load();
    </script>
</body>
</html>
