<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦐 小蝦理財機器人</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #fff; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; padding: 30px 0; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 30px; }
        header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 20px; }
        .stat-card .label { color: #888; font-size: 0.9em; margin-bottom: 5px; }
        .stat-card .value { font-size: 1.6em; font-weight: bold; }
        .positive { color: #4ade80; }
        .negative { color: #f87171; }
        .section { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 20px; margin-bottom: 15px; }
        .section h2 { font-size: 1.2em; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9em; }
        th { color: #888; font-weight: normal; }
        .footer { text-align: center; padding: 20px; color: #666; font-size: 0.85em; }
    </style>
    <meta http-equiv="refresh" content="300">
</head>
<body>
    <div class="container">
        <header>
            <h1>🦐 小蝦理財機器人</h1>
            <div style="color:#888">虛擬股票投資 | 目標：跑贏大盤</div>
        </header>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">總市值</div>
                <div class="value" id="total">載入中...</div>
            </div>
            <div class="stat-card">
                <div class="label">現金</div>
                <div class="value" id="cash">...</div>
            </div>
            <div class="stat-card">
                <div class="label">投資損益</div>
                <div class="value" id="profit">...</div>
            </div>
            <div class="stat-card">
                <div class="label">vs 大盤</div>
                <div class="value" id="vs">...</div>
            </div>
        </div>
        
        <div class="section">
            <h2>📈 持股明細</h2>
            <div id="holdings"></div>
        </div>
        
        <div class="footer">
            更新時間: <span id="updated">-</span> | 每5分鐘自動更新
        </div>
    </div>
    
    <script>
    async function load() {
        try {
            const r = await fetch('data.json');
            const d = await r.json();
            
            document.getElementById('total').textContent = '$' + d.total_value.toLocaleString();
            document.getElementById('cash').textContent = '$' + d.cash.toLocaleString();
            
            const p = document.getElementById('profit');
            p.textContent = (d.profit>=0?'+':'') + '$' + d.profit.toLocaleString() + ' (' + d.profit_pct.toFixed(1) + '%)';
            p.className = 'value ' + (d.profit>=0?'positive':'negative');
            
            const v = document.getElementById('vs');
            v.textContent = (d.vs_benchmark>=0?'+':'') + d.vs_benchmark.toFixed(1) + '%';
            v.className = 'value ' + (d.vs_benchmark>=0?'positive':'negative');
            
            const h = document.getElementById('holdings');
            if (d.holdings && d.holdings.length > 0) {
                let html = '<table><tr><th>股票</th><th>數量</th><th>均價</th><th>現價</th><th>市值</th><th>損益</th></tr>';
                for (const i of d.holdings) {
                    const pc = i.profit >= 0 ? 'positive' : 'negative';
                    const ps = i.profit >= 0 ? '+' : '';
                    html += '<tr><td>'+i.symbol+' '+i.name+'</td><td>'+i.quantity+'</td><td>$'+i.avg_cost.toFixed(2)+'</td><td>$'+i.current_price.toFixed(2)+'</td><td>$'+i.value.toLocaleString()+'</td><td class="'+pc+'">'+ps+'$'+i.profit.toLocaleString()+' ('+ps+i.profit_pct.toFixed(1)+'%)</td></tr>';
                }
                html += '</table>';
                h.innerHTML = html;
            } else {
                h.innerHTML = '<p style="color:#666;text-align:center">尚未建立部位</p>';
            }
            
            document.getElementById('updated').textContent = d.updated;
        } catch(e) {
            console.error(e);
            document.getElementById('total').textContent = '載入失敗';
        }
    }
    load();
    </script>
</body>
</html>
